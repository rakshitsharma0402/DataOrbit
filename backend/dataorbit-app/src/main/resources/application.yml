# DataOrbit backend defaults for local development.
# Real credentials never go in this file. Override settings with environment variables
# (for example SERVER_PORT=9090 or DATAORBIT_FRONTEND_ORIGIN=http://localhost:3000).

spring:
  application:
    name: dataorbit

  # Local PostgreSQL (docs/setup.md). The password has no default on purpose: set
  # DATAORBIT_DB_PASSWORD in your shell, or startup fails.
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/dataorbit
    username: dataorbit
    password: ${DATAORBIT_DB_PASSWORD}

  # Flyway owns the schema (ADR-0001). It applies classpath:db/migration on startup; a failed
  # migration stops startup. Never clean a real database.
  flyway:
    clean-disabled: true
    validate-migration-naming: true

server:
  # Required, and must be a literal loopback IP (handbook chapter 17). Startup fails otherwise.
  address: 127.0.0.1
  port: 8080

dataorbit:
  # Required. The one browser origin allowed to call the API (used for CORS in the frontend issue).
  frontend-origin: http://localhost:5173
